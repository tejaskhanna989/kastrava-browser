# Canonical multi-platform release builder.
# Triggered by v* tags or manual dispatch. Builds Windows/Linux/macOS/Android installers
# in parallel, then publishes all artifacts to a GitHub Release.
name: Build Kastrava releases

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows installers'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux packages'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS app'
        type: boolean
        default: true
      release_version:
        description: 'Optional tag to publish from this build (e.g. v102.0.1)'
        type: string
        default: ''
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Build free bundle
        run: npm run build:prod
        env:
          KAS_API: https://api.kastrava.in
          KAS_STORE: https://kastrava.in
      - name: Package Windows installers (unsigned)
        run: npx electron-builder --win --x64 --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-win
          path: |
            release/Kastrava-Setup-*.exe
            release/Kastrava-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Get version
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: sudo apt-get update && sudo apt-get install -y fakeroot rpm zstd libarchive-tools
      - run: npm ci --no-audit --no-fund
      - name: Build free bundle
        run: npm run build:prod
        env:
          KAS_API: https://api.kastrava.in
          KAS_STORE: https://kastrava.in
      - name: Package Linux formats
        run: npx electron-builder --linux --x64 --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache
      - name: Build Arch package
        run: |
          version=$(node -p "require('./package.json').version")
          sed -i -E "s/^pkgver=.*/pkgver=${version}/" packaging/arch/PKGBUILD
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/packaging/arch archlinux:base-devel bash -euc '
            useradd -m packagebuilder
            chown -R packagebuilder:packagebuilder .
            su packagebuilder -c "makepkg -f --nodeps --noconfirm"
          ' > /tmp/arch-build.log 2>&1
          status=$?
          cat /tmp/arch-build.log
          if [ "$status" -ne 0 ]; then
            echo "::error title=Arch build status::exit=$status; log-bytes=$(wc -c < /tmp/arch-build.log)"
            grep -Ei 'error|failed|cannot|not found|missing|permission denied|fatal|unsupported' /tmp/arch-build.log | tail -n 12 > /tmp/arch-errors.log || true
            if [ ! -s /tmp/arch-errors.log ]; then tail -n 12 /tmp/arch-build.log > /tmp/arch-errors.log; fi
            while IFS= read -r line; do echo "::error title=Arch build detail::$line"; done < /tmp/arch-errors.log
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          mkdir -p release
          mv packaging/arch/kastrava-*.pkg.tar.zst release/
      - name: Upload Arch build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-build-diagnostics
          path: /tmp/arch-build.log
          if-no-files-found: warn
      - name: Create release directory structure
        run: |
          mkdir -p release
          ls -la release/
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/latest-linux.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Get version
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Build free bundle
        run: npm run build:prod
        env:
          KAS_API: https://api.kastrava.in
          KAS_STORE: https://kastrava.in
      - name: Package macOS app
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-macos
          path: |
            release/*.dmg
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Get version
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore release keystore
        run: |
          mkdir -p keystore
          if [ -n "${{ secrets.ANDROID_KS_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KS_B64 }}" | base64 -d > keystore/kastrava-release.jks
            echo "release keystore restored"
          else
            echo "no keystore secret — release will be debug-signed (do not ship)"
          fi
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
        env:
          KASTRAVA_KS_FILE: ${{ github.workspace }}/android/keystore/kastrava-release.jks
          KASTRAVA_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KASTRAVA_KEY_ALIAS: kastrava
      - name: Rename APKs to release filenames
        run: |
          v=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/std/release/app-std-release.apk "Kastrava-${v}.apk"
          cp app/build/outputs/apk/ru/release/app-ru-release.apk "Kastrava-ru-${v}.apk"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-android
          path: android/Kastrava-*.apk
          if-no-files-found: error
      - name: Get version
        id: get-version
        run: echo "version=$(node -p "require('../package.json').version")" >> $GITHUB_OUTPUT

  publish:
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Kastrava ${{ inputs.release_version || github.ref_name }}
          tag_name: ${{ inputs.release_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            artifacts/Kastrava-win/*
            artifacts/Kastrava-linux/*
            artifacts/Kastrava-macos/*
            artifacts/Kastrava-android/*
          generate_release_notes: true
